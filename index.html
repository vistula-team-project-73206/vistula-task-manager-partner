<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.5; color: #222; }
    header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
    #status-message { min-height: 24px; margin-bottom: 15px; font-weight: bold; }
    .status-ok { color: #166534; }
    .status-err { color: #991b1b; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; }
    input, textarea, button { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { cursor: pointer; }
    .task-item { border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .task-item.is-completed .task-title { text-decoration: line-through; color: #6b7280; }
    .task-actions { margin-top: 10px; display: flex; gap: 8px; }
    .nav-link { margin-top: 30px; display: inline-block; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>Task Manager</h1>
    <div>Student ID: <span id="student-id">73704</span></div>
  </header>

  <div id="status-message"></div>

  <form id="task-form">
    <input type="hidden" id="task-id" value="">
    <input type="text" id="task-title" placeholder="Task title..." required>
    <textarea id="task-description" placeholder="Task description..." rows="3"></textarea>
    <button type="submit" id="task-submit">Add Task</button>
  </form>

  <div id="task-list"></div>

  <div>
    <a href="contribution.html" id="contribution-link" class="nav-link">Go to Contribution Page</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
